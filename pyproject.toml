[project]
name = "agent-harness"
version = "0.1.0"
description = "Agent Harness agnóstico: MCP, Tool Calling, Permisos y TUI."
requires-python = ">=3.11,<3.13"

dependencies = [
    # Núcleo del agente y utilidades
    "python-dotenv",
    "pydantic-settings",
    "httpx",
    # LLM Abstracto (OpenAI SDK como base compatible con OpenRouter/Groq, etc.)
    "openai",
    # MCP (Model Context Protocol) - Cliente
    "mcp",
    # TUI (Interfaz de Usuario en Terminal)
    "rich",
    "textual>=8.2.8",
    # Resiliencia (MCP reconexión)
    "tenacity>=9.2.1",
    # Memoria Vectorial (sqlite-vec + fastembed)
    "onnxruntime<1.24.1",
    "sqlite-vec>=0.1.9",
    "fastembed>=0.9.1",
    "textual-image[textual]>=0.12.0",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pandas>=3.1.1",
    "langfuse>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "tomlscript",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Mantenemos tu configuración de cobertura y reporte
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-report=xml --junitxml=junit.xml -o junit_family=legacy --ignore=tests/integration"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::RuntimeWarning",
]

[tool.tomlscript]
# Scripts de desarrollo
dev = "uv run python -m app.main" # Asumiendo que main.py lanza la TUI
test = "uv run pytest tests/ --cov=app --cov-report=term-missing --cache-clear"
test-integration = "uv run pytest tests/integration/* -v -s"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    '^\s*\.\.\.\s*$',
    '^\s*except.*:\s*$',
    '^\s*continue\s*$',
    '^\s*def on_',
    '^\s*def watch_',
    '^\s*def compose',
    # 🔥 Líneas que el intérprete no alcanza en los tests
    '^\s*return$',
]

